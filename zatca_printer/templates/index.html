        function goBack() {
            if (document.referrer && document.referrer.includes(window.location.host) && !document.referrer.includes('/login')) {
                window.history.back();
            } else {
                window.location.href = '/dashboard';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const billNo = urlParams.get('bill_no');
            if(billNo) {
                document.getElementById('searchInput').value = billNo;
                fetchInvoice();
            }
        });

        function adjustScale() {
            const wrapper = document.getElementById('scaleWrapper');
            const container = document.getElementById('invoiceContainer');
            
            if (!container || container.classList.contains('hidden')) {
                if (wrapper) wrapper.style.height = 'auto';
                return;
            }

            const a4Width = 794; // ~210mm in pixels at 96 DPI
            const availableWidth = wrapper.clientWidth - 16;

            if (availableWidth < a4Width && availableWidth > 0) {
                const scale = availableWidth / a4Width;
                container.style.transform = `scale(${scale})`;
                
                // Adjust wrapper height to prevent excess scroll space
                const originalHeight = container.offsetHeight;
                wrapper.style.height = (originalHeight * scale) + 60 + 'px'; 
            } else {
                container.style.transform = 'none';
                wrapper.style.height = 'auto';
            }
        }

        window.addEventListener('resize', adjustScale);
        window.addEventListener('afterprint', adjustScale);

        function formatMoney(n) {
            return parseFloat(n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

        async function fetchInvoice() {
            const billNo = document.getElementById('searchInput').value;
            const status = document.getElementById('statusMessage');
            const container = document.getElementById('invoiceContainer');
            
            if(!billNo) {
                status.innerText = "الرجاء إدخال رقم الفاتورة";
                return;
            }

            status.innerText = "جاري جلب البيانات...";
            container.classList.add('hidden');
            container.innerHTML = "";

            try {
                const res = await fetch('/api/invoice/' + billNo);
                const data = await res.json();

                if(data.error) {
                    status.innerText = data.error;
                    return;
                }

                status.innerText = "";
                
                // Pagination calculation (Filling every page completely)
                const items = data.items || [];
                const totalItems = items.length;
                let pageChunks = [];

                const MAX_INTERMEDIATE = 16;
                const MAX_LAST = 8;

                if (totalItems <= MAX_LAST) {
                    pageChunks.push(items);
                } else {
                    let remaining = [...items];
                    while (remaining.length > 0) {
                        if (remaining.length <= MAX_LAST) {
                            pageChunks.push(remaining);
                            break;
                        }
                        
                        // Greedily fill this intermediate page up to MAX_INTERMEDIATE (16)
                        let take = Math.min(MAX_INTERMEDIATE, remaining.length - 1);
                        if (remaining.length - take > MAX_LAST) {
                            take = MAX_INTERMEDIATE;
                        }

                        pageChunks.push(remaining.slice(0, take));
                        remaining = remaining.slice(take);
                    }
                }

                const totalPages = pageChunks.length;

                // Render each page
                pageChunks.forEach((chunk, pageIdx) => {
                    const isLastPage = (pageIdx === totalPages - 1);
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'a4-page mx-auto';
                    pageDiv.setAttribute('dir', 'rtl');

                    let pageHTML = buildHeaderHTML(data, pageIdx + 1, totalPages);
                    pageHTML += buildItemsTableHTML(chunk);

                    if(isLastPage) {
                        pageHTML += buildBottomHTML(data.totals);
                    }

                    pageDiv.innerHTML = pageHTML;

                    // Generate QR Code for this page
                    if(data.qr_base64) {
                        const qrPlaceholder = pageDiv.querySelector('.qrcode-placeholder');
                        if(qrPlaceholder) {
                            const typeNumber = 0;
                            const errorCorrectionLevel = 'M';
                            const qr = qrcode(typeNumber, errorCorrectionLevel);
                            qr.addData(data.qr_base64);
                            qr.make();
                            qrPlaceholder.innerHTML = qr.createImgTag(5, 0); 
                            const img = qrPlaceholder.querySelector('img');
                            if(img) img.classList.add('qr-code-img');
                        }
                    }

                    container.appendChild(pageDiv);
                });

                container.classList.remove('hidden');
                
                // Apply scale adjustment based on screen size
                setTimeout(adjustScale, 50);

            } catch (err) {
                status.innerText = "حدث خطأ في جلب البيانات: " + err.message;
            }
        }

        async function shareWhatsApp() {
            const container = document.getElementById('invoiceContainer');
            if (container.classList.contains('hidden') || container.innerHTML.trim() === '') {
                alert("الرجاء عرض الفاتورة أولاً");
                return;
            }

            const status = document.getElementById('statusMessage');
            status.innerText = "جاري تجهيز الفاتورة كملف PDF (لضمان وضوح النص العربي والتصميم)...";
            
            // Temporary reset transform to ensure proper full-size image generation
            const oldTransform = container.style.transform;
            container.style.transform = 'none';

            const invoiceNo = document.getElementById('searchInput').value;
            const filename = `Invoice_${invoiceNo}.pdf`;

            try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pages = container.querySelectorAll('.a4-page');
                
                // Process each page individually to support multi-page PDFs
                for (let i = 0; i < pages.length; i++) {
                    const page = pages[i];
                    
                    // Generate High-Res Image for this specific page (preserves Arabic natively)
                    const dataUrl = await htmlToImage.toJpeg(page, {
                        quality: 0.95,
                        backgroundColor: '#ffffff',
                        pixelRatio: 2
                    });
                    
                    if (i > 0) {
                        pdf.addPage();
                    }
                    
                    // A4 dimensions: 210 x 297 mm
                    pdf.addImage(dataUrl, 'JPEG', 0, 0, 210, 297);
                }
                
                // Restore transform for screen display
                container.style.transform = oldTransform;
                
                const pdfBlob = pdf.output('blob');
                const file = new File([pdfBlob], filename, { type: 'application/pdf' });

                // Use Web Share API if supported
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    status.innerText = "";
                    await navigator.share({
                        files: [file],
                        title: 'فاتورة ضريبية',
                        text: 'مرفق فاتورتك الضريبية بصيغة PDF.'
                    });
                } else {
                    // Fallback: Download the file automatically and instruct user
                    status.innerText = "";
                    alert("المشاركة المباشرة غير مدعومة في متصفحك. سيتم تحميل الفاتورة كـ PDF لتتمكن من إرسالها يدوياً عبر الواتساب.");
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(pdfBlob);
                    link.download = filename;
                    link.click();
                }
            } catch (error) {
                console.error('Error creating PDF:', error);
                status.innerText = "حدث خطأ أثناء تجهيز الفاتورة للمشاركة.";
                container.style.transform = oldTransform;
            }
        }
    </script>
