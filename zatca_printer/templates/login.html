<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - بوابة المناديب | SREEN</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <link rel="apple-touch-icon" href="/static/logo.png">
    <meta name="apple-mobile-web-app-title" content="SREEN">
    <meta name="application-name" content="SREEN">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.6s ease-out forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: 0, transform: 'translateY(20px)' },
                            '100%': { opacity: 1, transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f8fafc;
            color: #0f172a;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }

        .premium-input {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #cbd5e1;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.02);
        }
        .premium-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15), inset 0 2px 4px 0 rgba(0, 0, 0, 0.02);
            background: #ffffff;
        }

        .btn-gradient {
            background: linear-gradient(to right, #2563eb, #4f46e5);
            color: white;
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.3);
        }

        .icon-gradient-blue {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        }
    </style>
</head>
<body class="antialiased selection:bg-primary-500 selection:text-white">

    <div class="glass-card rounded-[2.5rem] p-8 md:p-12 w-[90%] max-w-md mx-auto opacity-0 animate-fade-in-up relative overflow-hidden">
        
        <!-- Decorative Glow -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-primary-500 rounded-full mix-blend-multiply filter blur-3xl opacity-10 animate-blob"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-indigo-500 rounded-full mix-blend-multiply filter blur-3xl opacity-10 animate-blob animation-delay-2000"></div>

        <div class="text-center mb-10 relative z-10">
            <div class="icon-gradient-blue w-20 h-20 rounded-3xl flex items-center justify-center text-4xl mx-auto mb-6 text-white shadow-lg">
                💼
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 mb-2">بوابة المناديب</h1>
            <p class="text-slate-500 text-sm font-semibold">مرحباً بك مجدداً، يرجى تسجيل الدخول</p>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="mb-8 relative z-10">
              {% for message in messages %}
                <div class="bg-rose-50 border border-rose-200 text-rose-700 p-4 rounded-xl text-sm mb-2 text-right shadow-sm flex items-start gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 mt-0.5 text-rose-500"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
                    <span class="font-bold">{{ message }}</span>
                </div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}" class="space-y-6 relative z-10">
            <div class="space-y-2 text-right">
                <label for="rep_code" class="block text-sm font-extrabold text-slate-700">اسم المستخدم</label>
                <div class="relative">
                    <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-slate-400">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </div>
                    <input type="text" id="rep_code" name="rep_code" placeholder="اسم المستخدم" required autocomplete="off" 
                           class="premium-input w-full pl-5 pr-12 py-3.5 rounded-2xl text-slate-900 placeholder-slate-400 text-right font-semibold text-base">
                </div>
            </div>
            
            <div class="space-y-2 text-right">
                <label for="password" class="block text-sm font-extrabold text-slate-700">كلمة المرور</label>
                <div class="relative">
                    <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-slate-400">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </div>
                    <input type="password" id="password" name="password" placeholder="••••••••" required
                           class="premium-input w-full pl-5 pr-12 py-3.5 rounded-2xl text-slate-900 placeholder-slate-400 text-right font-semibold text-lg tracking-widest">
                </div>
            </div>

            <button type="submit" class="btn-gradient w-full py-4 rounded-2xl font-bold text-lg mt-8 flex justify-center items-center gap-3">
                تسجيل الدخول
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
        </form>
    </div>

</body>
</html>
